[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akuma-daemon"
version = "0.1.0"
description = "Resident scheduler and event core for Akuma"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]
windows = ["pywin32>=306"]

[project.scripts]
akuma-daemon = "akuma_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
